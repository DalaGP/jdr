<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'atelier de Goulven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --soot: #1B1815;
    --plate: #2C2620;
    --plate-hover: #342D26;
    --parchment: #EDE6DA;
    --parchment-dim: #9C9188;
    --ember: #C9702F;
    --line: rgba(237,230,218,0.09);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--soot);
    color: var(--parchment);
    font-family: 'Public Sans', sans-serif;
    line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important; } }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; }
  a{ color: inherit; }
  button{ font-family:'Public Sans', sans-serif; cursor: pointer; }
  :focus-visible{ outline: 2px solid var(--ember); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    gap: 1rem; padding: 1rem 1.5rem;
    background: rgba(27,24,21,0.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .brand{ font-family:'Fraunces', serif; font-size:1.05rem; text-decoration:none; }
  .topbar-right{ display:flex; align-items:center; gap:0.9rem; }
  .edit-toggle{
    border: 1px solid var(--ember); background: transparent; color: var(--parchment);
    padding: 0.5rem 1rem; border-radius: 3px; font-size: 0.85rem; letter-spacing: 0.01em;
    transition: background 0.2s ease;
  }
  .edit-toggle.active{ background: var(--ember); color: var(--soot); font-weight: 600; }
  .edit-toggle:hover{ background: rgba(201,112,47,0.18); }
  .edit-toggle.active:hover{ background: var(--ember); }
  .io-btn{
    background:none; border:none; color: var(--parchment-dim); font-size: 0.8rem;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .io-btn:hover{ color: var(--parchment); }
  .draft-badge{
    font-size: 0.76rem; color: var(--ember); border: 1px solid var(--ember);
    padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap;
  }

  main{ max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }

  /* ---------- home ---------- */
  .hero{ padding: 4.5rem 0 3rem; text-align: center; }
  .hero h1{ font-size: clamp(2.4rem, 5.5vw, 3.6rem); }
  .hero p{ color: var(--parchment-dim); max-width: 46ch; margin: 1rem auto 0; }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.6rem; padding: 1rem 0 5rem;
  }
  .card{
    position: relative; background: var(--plate); border-radius: 3px;
    overflow: hidden; text-decoration: none; color: var(--parchment);
    border: 1px solid var(--line); transition: transform 0.2s ease, background 0.2s ease;
  }
  .card:hover{ background: var(--plate-hover); transform: translateY(-2px); }
  .card-image{
    aspect-ratio: 4/3; background: #23201B;
    display:flex; align-items:center; justify-content:center;
    color: var(--parchment-dim); font-size: 0.82rem;
    background-size: cover; background-position: center;
  }
  .card-body{ padding: 1.1rem 1.2rem 1.3rem; border-top: 2px solid var(--accent, var(--ember)); }
  .card-eyebrow{ font-size: 0.78rem; color: var(--accent, var(--ember)); }
  .card h3{ font-size: 1.25rem; margin: 0.25rem 0 0.4rem; }
  .card-tagline{ font-size: 0.88rem; color: var(--parchment-dim); font-style: italic; font-family: 'Fraunces', serif; }
  .card-del{
    position:absolute; top: 0.6rem; right: 0.6rem; z-index: 3;
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(20,17,15,0.75); color: var(--parchment); font-size: 0.95rem;
    display:flex; align-items:center; justify-content:center;
  }
  .card-del:hover{ background: #a63b3b; }
  .vote-btn{
    position:absolute; top: 0.6rem; left: 0.6rem; z-index: 3;
    display:flex; align-items:center; gap: 0.35rem;
    background: rgba(20,17,15,0.78); border: 1px solid rgba(237,230,218,0.22);
    color: var(--parchment); font-size: 0.82rem; padding: 0.32rem 0.65rem 0.32rem 0.55rem;
    border-radius: 20px; line-height: 1;
  }
  .vote-btn:hover:not(:disabled){ border-color: var(--ember); }
  .vote-btn:disabled{ cursor: default; }
  .vote-btn.voted{ color: var(--ember); border-color: var(--ember); }
  .vote-btn .star{ font-size: 0.95rem; }

  .add-card{
    display:flex; flex-direction: column; align-items:center; justify-content:center;
    gap: 0.5rem; min-height: 200px; background: transparent;
    border: 1px dashed rgba(237,230,218,0.28); color: var(--parchment-dim);
    border-radius: 3px; font-size: 0.95rem;
  }
  .add-card:hover{ color: var(--parchment); border-color: var(--ember); }
  .add-card .plus{ font-size: 1.8rem; font-family:'Fraunces', serif; color: var(--ember); }

  /* ---------- detail page ---------- */
  .back-link{
    display:inline-block; margin: 2.2rem 0 1rem; font-size: 0.9rem; color: var(--parchment-dim);
    text-decoration:none;
  }
  .back-link:hover{ color: var(--parchment); }

  .detail{ padding-bottom: 5rem; }
  .detail-grid{
    display:grid; grid-template-columns: 1fr 1.15fr; gap: clamp(1.6rem, 4vw, 3.2rem);
    align-items: start; margin-top: 1rem;
  }
  @media (max-width: 760px){ .detail-grid{ grid-template-columns: 1fr; } }

  .detail-image{
    aspect-ratio: 4/5; border-radius: 3px; background: #23201B; position: relative;
    background-size: cover; background-position: center; overflow: hidden;
    display:flex; align-items:center; justify-content:center; border: 1px solid var(--line);
  }
  .detail-image-empty{ color: var(--parchment-dim); font-size: 0.9rem; text-align:center; padding: 1rem; }
  .image-edit-btn{
    position:absolute; bottom: 0.8rem; right: 0.8rem;
    background: rgba(20,17,15,0.82); color: var(--parchment); border: 1px solid rgba(237,230,218,0.25);
    padding: 0.45rem 0.8rem; border-radius: 3px; font-size: 0.8rem;
  }
  .image-edit-btn:hover{ border-color: var(--ember); }

  .accent-row{ display:flex; align-items:center; gap: 0.7rem; margin-bottom: 0.5rem; }
  .accent-row input[type=color]{
    width: 26px; height: 26px; border: none; border-radius: 50%; overflow: hidden;
    background: none; padding: 0; cursor: pointer;
  }
  .eyebrow{ font-size: 0.85rem; color: var(--accent, var(--ember)); }
  .eyebrow[contenteditable="true"]{ outline: 1px dashed rgba(237,230,218,0.3); padding: 0.1rem 0.3rem; border-radius: 2px; }

  h2.title{ font-size: clamp(1.9rem, 3.6vw, 2.6rem); margin: 0.4rem 0 0.8rem; }
  .tagline{
    font-family: 'Fraunces', serif; font-style: italic; font-size: 1.12rem; margin-bottom: 1.2rem;
  }
  .description{ color: var(--parchment-dim); max-width: 58ch; white-space: pre-wrap; }

  .meta-row{ display:flex; gap: 1.6rem; margin-top: 1.6rem; flex-wrap: wrap; }
  .meta-item{ border-left: 2px solid var(--accent, var(--ember)); padding-left: 0.7rem; min-width: 140px; }
  .meta-item dt{ font-size: 0.78rem; color: var(--parchment-dim); }
  .meta-item dd{ font-size: 0.95rem; margin-top: 0.15rem; }

  [contenteditable="true"]{
    outline: 1px dashed rgba(237,230,218,0.3); border-radius: 2px; padding: 0.05rem 0.3rem;
  }
  [contenteditable="true"]:focus{ outline: 1px solid var(--ember); background: rgba(201,112,47,0.06); }

  .link-field{ margin-top: 1.5rem; }
  .link-field label{ font-size: 0.78rem; color: var(--parchment-dim); display:block; margin-bottom: 0.3rem; }
  .link-field input{
    background: var(--plate); border: 1px solid var(--line); color: var(--parchment);
    padding: 0.5rem 0.7rem; border-radius: 3px; font-size: 0.88rem; width: 100%; max-width: 340px;
  }
  .world-link{
    display:inline-block; margin-top: 1.4rem; font-size: 0.95rem; text-decoration:none;
    border-bottom: 1px solid var(--accent, var(--ember)); padding-bottom: 2px;
  }

  footer{
    padding: 3rem 1.5rem; text-align:center; color: var(--parchment-dim);
    font-size: 0.85rem; border-top: 1px solid var(--line);
  }

  .hint{
    font-size: 0.8rem; color: var(--parchment-dim); background: rgba(201,112,47,0.08);
    border: 1px solid rgba(201,112,47,0.25); padding: 0.7rem 1rem; border-radius: 3px;
    margin: 1.2rem 0 0;
  }
  input[type=file]{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <a href="#/" class="brand">L'atelier de Goulven</a>
  <div class="topbar-right">
    <span class="draft-badge" id="draftBadge" hidden>Brouillon non publié</span>
    <button class="io-btn" id="discardBtn" hidden>Revenir à la version publiée</button>
    <button class="io-btn" id="exportBtn">Exporter</button>
    <button class="io-btn" id="importBtn">Importer</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="edit-toggle" id="editToggle">Mode édition</button>
  </div>
</div>

<main id="app"></main>

<footer>Chaque monde ici a été joué, corrigé, parfois mis en pause — jamais vraiment refermé.</footer>

<script>
const STORAGE_KEY = 'ateliers-de-mondes-data-v1';

const seed = [
  {
    id: 'antika',
    accent: '#C4A661',
    eyebrow: 'Univers',
    title: 'Antika',
    tagline: "Descendre d'un dieu, c'est aussi hériter de sa colère.",
    description: "Antika met les joueurs dans la peau de descendants mortels de figures comme Léthé, Chronos ou Hécate — chacun porteur d'un don et d'une dette envers son ascendant divin. Les scènes de châtiment y sont écrites sur mesure pour chaque lignée, et l'univers se lit jusque dans le papier : fiches en parchemin et lettrage doré, dans le ton d'une tragédie grecque qu'on aurait laissée continuer.",
    meta1Label: 'Genre', meta1: 'Mythologie grecque, tragédie',
    meta2Label: 'Matière de jeu', meta2: 'Lignées divines, châtiments, dettes',
    link: '', image: null
  },
  {
    id: 'brume-et-belladone',
    accent: '#6C8F72',
    eyebrow: 'Système original',
    title: 'Brume & Belladone',
    tagline: "Londres, 1888. Il y a un poison à chaque coin de rue, botanique compris.",
    description: "Brume & Belladone est un système conçu sur mesure pour une atmosphère gothique et victorienne — archétypes aux distributions de dés retravaillées jusqu'à ce que chaque profil se sente juste en jeu. La campagne complète « L'Héritage de la Sève Noire » oppose les joueurs à Dame Elspeth Crane et à un complot de Grande Convergence, traversée en dix sessions par Morrigan Ashcroft, botaniste mutante armée d'un grimoire de plantes bien vivant.",
    meta1Label: 'Système', meta1: 'Homebrew, archétypes à dés',
    meta2Label: 'Format joué', meta2: 'Campagne solo, 10 sessions',
    link: '', image: null
  },
  {
    id: 'erosion-du-chant',
    accent: '#9B7FBF',
    eyebrow: 'Campagne, 5 joueurs',
    title: "L'Érosion du Chant",
    tagline: "La Caravane des Mogs avance encore, même quand le chant s'efface.",
    description: "Inspirée de Final Fantasy XIV, cette campagne suit une caravane à travers un monde où un chant ancien s'érode peu à peu. L'acte II vient d'être bouclé avec ses feuilles de personnage compagnons, avant une pause : le groupe est retourné à l'histoire principale de FFXIV. La campagne vit aussi en dehors de la table, sur son application compagnon, la Wisteria.",
    meta1Label: 'Inspiration', meta1: 'Final Fantasy XIV',
    meta2Label: 'Statut', meta2: 'En pause, Acte II terminé',
    link: 'https://dalagp.github.io/Wisteria/', image: null
  },
  {
    id: 'villains-quest',
    accent: '#C0475A',
    eyebrow: 'Scénario, ton second degré',
    title: "Villain's Quest",
    tagline: "Cette fois, ce sont les méchants qui montent une armée.",
    description: "Un scénario pensé pour une table de cinq joueurs et plus — au-delà des trois ou quatre recommandés par le livre. Un acte 0 est dédié à la création du personnage et de son armée, avant de lancer une quête où les méchants sont volontairement cartoonesques, le ton assumé léger et second degré du début à la fin.",
    meta1Label: 'Format', meta1: 'Table élargie, 5 joueurs+',
    meta2Label: 'Ton', meta2: 'Léger, méchants cartoonesques',
    link: '', image: null
  }
];

let data = JSON.parse(JSON.stringify(seed));
let publishedData = null;
let editMode = false;
let usingDraft = false;

/* ---------- votes (partagés via CounterAPI v2, compte + workspace) ---------- */
const VOTE_WORKSPACE = 'goulven-atelier-jdr';
const VOTE_TOKEN = 'ut_Tvu91EHw8mZhjQkg5VEVH7Y1ZPVPtzncy7nqYKD9';
const VOTED_KEY = 'ateliers-de-mondes-voted-v1';
let voteCounts = {};
let votedSet = new Set(loadVotedIds());

function loadVotedIds(){
  try{
    const raw = localStorage.getItem(VOTED_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveVotedIds(){
  try{ localStorage.setItem(VOTED_KEY, JSON.stringify([...votedSet])); }catch(e){}
}
function counterHeaders(){
  return { 'Authorization': `Bearer ${VOTE_TOKEN}` };
}
function parseCount(json){
  const d = json && json.data ? json.data : json;
  if(!d) return null;
  if(typeof d.value === 'number') return d.value;
  if(typeof d.up_count === 'number'){
    const down = typeof d.down_count === 'number' ? d.down_count : 0;
    return d.up_count - down;
  }
  if(typeof d.count === 'number') return d.count;
  return null;
}
async function fetchAllVotes(){
  const counts = {};
  await Promise.all(data.map(async w => {
    try{
      const res = await fetch(`https://api.counterapi.dev/v2/${VOTE_WORKSPACE}/${encodeURIComponent(w.id)}`, {
        headers: counterHeaders()
      });
      if(res.ok){
        const json = await res.json();
        const val = parseCount(json);
        counts[w.id] = typeof val === 'number' ? val : 0;
      } else {
        counts[w.id] = 0;
      }
    }catch(e){ counts[w.id] = 0; }
  }));
  return counts;
}
async function voteFor(id){
  const alreadyVoted = votedSet.has(id);
  const direction = alreadyVoted ? 'down' : 'up';

  if(alreadyVoted){ votedSet.delete(id); } else { votedSet.add(id); }
  saveVotedIds();
  voteCounts[id] = Math.max(0, (voteCounts[id] || 0) + (alreadyVoted ? -1 : 1));
  render();

  try{
    const res = await fetch(`https://api.counterapi.dev/v2/${VOTE_WORKSPACE}/${encodeURIComponent(id)}/${direction}`, {
      headers: counterHeaders()
    });
    if(res.ok){
      const json = await res.json();
      const val = parseCount(json);
      if(typeof val === 'number'){ voteCounts[id] = val; render(); }
    }
  }catch(e){ /* le vote reste compté localement même si le réseau a raté */ }
}

async function fetchPublished(){
  try{
    const res = await fetch('./data.json', {cache: 'no-store'});
    if(!res.ok) return null;
    const json = await res.json();
    return Array.isArray(json) ? json : null;
  }catch(e){ return null; }
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Lecture locale impossible', e); }
  return null;
}
async function init(){
  publishedData = await fetchPublished();
  const draft = loadDraft();
  if(draft){
    data = draft;
    usingDraft = true;
  } else if(publishedData){
    data = publishedData;
  } else {
    data = JSON.parse(JSON.stringify(seed));
  }
  voteCounts = await fetchAllVotes();
  render();
}
function saveData(){
  usingDraft = true;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    alert("Sauvegarde impossible (espace de stockage local plein). Essaie d'exporter puis de retirer une image.");
  }
}
function discardDraft(){
  if(!confirm("Abandonner tes modifications non publiées et revenir à la version en ligne actuelle ?")) return;
  localStorage.removeItem(STORAGE_KEY);
  usingDraft = false;
  data = publishedData ? JSON.parse(JSON.stringify(publishedData)) : JSON.parse(JSON.stringify(seed));
  render();
}
function slugify(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('monde-' + Date.now());
}
function uniqueId(base){
  let id = base, n = 1;
  while(data.some(w => w.id === id)){ id = base + '-' + (++n); }
  return id;
}

const ACCENTS = ['#C9702F', '#C4A661', '#6C8F72', '#9B7FBF', '#C0475A', '#5B8AA6'];

function addWorld(){
  const accent = ACCENTS[data.length % ACCENTS.length];
  const w = {
    id: uniqueId('nouveau-monde'),
    accent,
    eyebrow: 'Univers',
    title: 'Nouveau JDR',
    tagline: 'Une accroche pour donner le ton.',
    description: "Décris ici l'ambiance, le pitch et ce qui rend cet univers reconnaissable.",
    meta1Label: 'Système', meta1: 'À préciser',
    meta2Label: 'Statut', meta2: 'À préciser',
    link: '', image: null
  };
  data.push(w);
  saveData();
  location.hash = '#/' + w.id;
}
function deleteWorld(id){
  const w = data.find(x => x.id === id);
  if(!w) return;
  if(!confirm('Retirer "' + w.title + '" de la vitrine ?')) return;
  data = data.filter(x => x.id !== id);
  saveData();
  location.hash = '#/';
  render();
}
function updateField(id, field, value){
  const w = data.find(x => x.id === id);
  if(!w) return;
  w[field] = value;
  saveData();
}

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1100;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function render(){
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  if(hash === '#/' || hash === ''){
    renderHome(app);
  } else {
    const id = decodeURIComponent(hash.slice(2));
    const w = data.find(x => x.id === id);
    if(!w){ location.hash = '#/'; return; }
    renderDetail(app, w);
  }
  document.getElementById('editToggle').classList.toggle('active', editMode);
  document.getElementById('editToggle').textContent = editMode ? 'Terminer l\u2019édition' : 'Mode édition';
  document.getElementById('draftBadge').hidden = !usingDraft;
  document.getElementById('discardBtn').hidden = !usingDraft;
}

function renderHome(app){
  const sorted = [...data].sort((a, b) => (voteCounts[b.id] || 0) - (voteCounts[a.id] || 0));
  let cards = sorted.map(w => {
    const count = voteCounts[w.id] || 0;
    const voted = votedSet.has(w.id);
    return `
    <a class="card" href="#/${encodeURIComponent(w.id)}" style="--accent:${w.accent}">
      ${editMode ? `<button class="card-del" title="Retirer" data-del="${w.id}">&times;</button>` : ''}
      <button class="vote-btn ${voted ? 'voted' : ''}" data-vote="${w.id}" title="${voted ? 'Retirer mon vote' : 'Ce jeu me tente'}">
        <span class="star">${voted ? '★' : '☆'}</span><span>${count}</span>
      </button>
      <div class="card-image" style="${w.image ? `background-image:url(${w.image})` : ''}">
        ${w.image ? '' : 'Aucune image'}
      </div>
      <div class="card-body">
        <div class="card-eyebrow">${escapeHtml(w.eyebrow)}</div>
        <h3>${escapeHtml(w.title)}</h3>
        <div class="card-tagline">${escapeHtml(w.tagline)}</div>
      </div>
    </a>
  `;
  }).join('');

  if(editMode){
    cards += `<button class="card add-card" id="addWorldBtn"><span class="plus">+</span>Ajouter un JDR</button>`;
  }

  app.innerHTML = `
    <section class="hero">
      <h1>L'atelier de Goulven</h1>
      <p>Un coin d'établi où mythologie, brouillard victorien et méchants cartoonesques cohabitent sans trop se marcher dessus.</p>
      ${editMode ? '<div class="hint">Mode édition actif — clique sur un texte pour le modifier, sur une image pour la changer. Ces changements ne sont visibles que dans ton navigateur : pour que tout le monde les voie, clique « Exporter » puis remplace le fichier <code>data.json</code> dans ton dépôt GitHub.</div>' : ''}
    </section>
    <div class="grid">${cards}</div>
  `;

  if(editMode){
    const addBtn = document.getElementById('addWorldBtn');
    if(addBtn) addBtn.addEventListener('click', addWorld);
    app.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        deleteWorld(btn.getAttribute('data-del'));
      });
    });
  }
  app.querySelectorAll('[data-vote]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      voteFor(btn.getAttribute('data-vote'));
    });
  });
}

function renderDetail(app, w){
  app.innerHTML = `
    <a class="back-link" href="#/">&larr; Tous les univers</a>
    <section class="detail">
      <div class="detail-grid">
        <div>
          <div class="detail-image" id="imgBox" style="${w.image ? `background-image:url(${w.image})` : ''}">
            ${w.image ? '' : `<div class="detail-image-empty">${editMode ? 'Ajoute une image (JPEG ou PNG)' : 'Pas encore d\u2019image'}</div>`}
            ${editMode ? `<button class="image-edit-btn" id="imgEditBtn">${w.image ? 'Changer l\u2019image' : 'Ajouter une image'}</button>` : ''}
          </div>
          <input type="file" id="imgInput" accept="image/png, image/jpeg">
        </div>
        <div>
          <div class="accent-row">
            ${editMode ? `<input type="color" id="accentPicker" value="${w.accent}">` : ''}
            <div class="eyebrow" id="f-eyebrow" ${editMode ? 'contenteditable="true"' : ''} style="--accent:${w.accent}">${escapeHtml(w.eyebrow)}</div>
          </div>
          <h2 class="title" id="f-title" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.title)}</h2>
          <div class="tagline" id="f-tagline" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.tagline)}</div>
          <div class="description" id="f-description" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.description)}</div>

          <dl class="meta-row">
            <div class="meta-item" style="--accent:${w.accent}">
              <dt id="f-meta1Label" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.meta1Label)}</dt>
              <dd id="f-meta1" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.meta1)}</dd>
            </div>
            <div class="meta-item" style="--accent:${w.accent}">
              <dt id="f-meta2Label" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.meta2Label)}</dt>
              <dd id="f-meta2" ${editMode ? 'contenteditable="true"' : ''}>${escapeHtml(w.meta2)}</dd>
            </div>
          </dl>

          ${editMode ? `
            <div class="link-field">
              <label for="f-link">Lien externe (optionnel)</label>
              <input type="text" id="f-link" placeholder="https://..." value="${escapeAttr(w.link || '')}">
            </div>
          ` : (w.link ? `<a class="world-link" href="${escapeAttr(w.link)}" target="_blank" rel="noopener" style="--accent:${w.accent}">Ouvrir le lien &#8599;</a>` : '')}
        </div>
      </div>
    </section>
  `;

  // text field bindings
  const textFields = ['eyebrow','title','tagline','description','meta1Label','meta1','meta2Label','meta2'];
  textFields.forEach(f => {
    const el = document.getElementById('f-' + f);
    if(el && editMode){
      el.addEventListener('blur', () => updateField(w.id, f, el.textContent.trim()));
    }
  });

  if(editMode){
    const linkInput = document.getElementById('f-link');
    if(linkInput) linkInput.addEventListener('change', () => updateField(w.id, 'link', linkInput.value.trim()));

    const accentPicker = document.getElementById('accentPicker');
    if(accentPicker) accentPicker.addEventListener('input', () => {
      updateField(w.id, 'accent', accentPicker.value);
      render();
    });

    const imgInput = document.getElementById('imgInput');
    const imgEditBtn = document.getElementById('imgEditBtn');
    if(imgEditBtn) imgEditBtn.addEventListener('click', () => imgInput.click());
    if(imgInput) imgInput.addEventListener('change', () => {
      const file = imgInput.files[0];
      if(!file) return;
      resizeImage(file, dataUrl => {
        updateField(w.id, 'image', dataUrl);
        render();
      });
    });
  }
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.getElementById('editToggle').addEventListener('click', () => {
  editMode = !editMode;
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('discardBtn').addEventListener('click', discardDraft);
document.getElementById('importFile').addEventListener('change', () => {
  const file = document.getElementById('importFile').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('format invalide');
      data = imported;
      saveData();
      location.hash = '#/';
      render();
      alert('Import réussi.');
    }catch(err){
      alert("Impossible de lire ce fichier — vérifie que c'est bien un export de ce site.");
    }
  };
  reader.readAsText(file);
});

window.addEventListener('hashchange', render);
init();
</script>
</body>
</html>
